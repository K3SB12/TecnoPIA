<!-- Interfaz completa para evaluación según ciclo -->
<div class="sistema-evaluacion-mep">
    <!-- Selector de Ciclo -->
    <div class="selector-ciclo">
        <h3>🏫 Seleccione el Ciclo Educativo</h3>
        <div class="ciclos-grid">
            <button class="ciclo-btn" data-ciclo="materno">
                <i class="fas fa-baby"></i>
                <span>Materno/Transición</span>
                <small>Evaluación Formativa</small>
            </button>
            <button class="ciclo-btn" data-ciclo="ciclo1">
                <i class="fas fa-pencil-alt"></i>
                <span>I Ciclo (1°-3°)</span>
                <small>TC 65% + TA 10% + PE 15% + AS 10%</small>
            </button>
            <button class="ciclo-btn" data-ciclo="ciclo2">
                <i class="fas fa-cogs"></i>
                <span>II Ciclo (4°-6°)</span>
                <small>TC 60% + TA 10% + PE 20% + AS 10%</small>
            </button>
            <button class="ciclo-btn" data-ciclo="ciclo3">
                <i class="fas fa-robot"></i>
                <span>III Ciclo (7°-9°)</span>
                <small>TC 50% + TA 10% + PT 30% + AS 10%</small>
            </button>
        </div>
    </div>
    
    <!-- Panel de Evaluación según ciclo seleccionado -->
    <div id="panel-evaluacion">
        <!-- Se carga dinámicamente según ciclo -->
    </div>
</div>
