<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoPIA - Sistema REAL de Evaluación MEP</title>
    <style>
        /* ESTILOS COMPLETOS EN UN SOLO ARCHIVO */
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #2ed573;
            --warning: #ffa502;
            --danger: #ff4757;
            --dark: #2c3e50;
            --light: #f8f9fa;
            --glass: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* CARD GLASSMORPHISM REAL */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 25px;
        }

        .card-header {
            border-bottom: 2px solid rgba(102, 126, 234, 0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-header h3 {
            color: var(--dark);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* BOTONES REALES QUE FUNCIONAN */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ed573, #1dd1a1);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757, #ff3838);
            color: white;
        }

        /* FORMULARIOS REALES */
        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
            font-size: 14px;
        }

        /* LAYOUT DE EVALUACIÓN */
        .evaluation-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
            margin-top: 20px;
        }

        /* LISTA DE ESTUDIANTES REAL */
        .student-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .student-item {
            padding: 15px;
            border-radius: 10px;
            background: white;
            margin-bottom: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .student-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .student-item.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
        }

        .student-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .student-info h4 {
            color: var(--dark);
            margin-bottom: 5px;
        }

        .student-info p {
            color: #666;
            font-size: 13px;
        }

        /* INDICADORES PNFT REALES */
        .indicators-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .indicator-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            border-left: 5px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .indicator-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .indicator-header h4 {
            color: var(--dark);
            font-size: 16px;
        }

        .indicator-score {
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        /* ESCALA DE EVALUACIÓN REAL */
        .rating-scale {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        .rating-option {
            flex: 1;
            text-align: center;
            padding: 10px;
            margin: 0 5px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .rating-option:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .rating-option.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            color: var(--primary);
            font-weight: bold;
        }

        .rating-value {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .rating-label {
            font-size: 12px;
            color: #666;
        }

        /* OBSERVACIONES */
        .observations textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
            min-height: 100px;
        }

        /* RESUMEN */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .summary-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .summary-value {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
            color: var(--primary);
        }

        .summary-label {
            color: #666;
            font-size: 14px;
        }

        /* NOTIFICACIONES */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification.success {
            background: linear-gradient(135deg, var(--success), #1dd1a1);
        }

        .notification.error {
            background: linear-gradient(135deg, var(--danger), #ff3838);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .evaluation-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER PRINCIPAL -->
        <div class="card">
            <div class="card-header">
                <h3><i class="fas fa-graduation-cap"></i> SISTEMA REAL DE EVALUACIÓN MEP - FORMACIÓN TECNOLÓGICA</h3>
                <div>
                    <button class="btn btn-primary" onclick="guardarEvaluacion()">
                        <i class="fas fa-save"></i> GUARDAR EVALUACIÓN
                    </button>
                    <button class="btn btn-success" onclick="exportarEvaluacion()">
                        <i class="fas fa-file-export"></i> EXPORTAR MEP
                    </button>
                </div>
            </div>
            
            <!-- CONFIGURACIÓN INICIAL -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div class="form-group">
                    <label><i class="fas fa-users"></i> GRUPO TECNOLÓGICO</label>
                    <select id="selectGrupo" class="form-control" onchange="cargarEstudiantes()">
                        <option value="">SELECCIONE GRUPO...</option>
                        <option value="tecno7">7° Año - Informática</option>
                        <option value="tecno8">8° Año - Robótica</option>
                        <option value="tecno9">9° Año - Programación</option>
                        <option value="tecno10">10° Año - Redes</option>
                        <option value="tecno11">11° Año - Desarrollo Software</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-calendar"></i> PERÍODO</label>
                    <select id="selectPeriodo" class="form-control">
                        <option value="1">I Trimestre</option>
                        <option value="2">II Trimestre</option>
                        <option value="3">III Trimestre</option>
                        <option value="final">Evaluación Final</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-tools"></i> MÓDULO TECNOLÓGICO</label>
                    <select id="selectModulo" class="form-control">
                        <option value="programacion">Programación</option>
                        <option value="redes">Redes y Comunicaciones</option>
                        <option value="hardware">Hardware y Mantenimiento</option>
                        <option value="diseno">Diseño Digital</option>
                        <option value="robotica">Robótica Educativa</option>
                        <option value="seguridad">Seguridad Informática</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-clipboard-check"></i> TIPO DE EVIDENCIA</label>
                    <select id="selectEvidencia" class="form-control">
                        <option value="proyecto">Proyecto Tecnológico</option>
                        <option value="practica">Práctica de Laboratorio</option>
                        <option value="portafolio">Portafolio Digital</option>
                        <option value="examen">Examen Práctico</option>
                        <option value="investigacion">Investigación Tecnológica</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="evaluation-grid">
            <!-- COLUMNA IZQUIERDA: LISTA DE ESTUDIANTES -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-user-graduate"></i> ESTUDIANTES DEL GRUPO</h3>
                    <span id="contadorEstudiantes">0 estudiantes</span>
                </div>
                <div class="student-list" id="listaEstudiantes">
                    <!-- Los estudiantes se cargarán aquí automáticamente -->
                </div>
            </div>

            <!-- COLUMNA DERECHA: EVALUACIÓN -->
            <div class="card">
                <div class="card-header">
                    <h3><i class="fas fa-clipboard-check"></i> EVALUACIÓN DE COMPETENCIAS TECNOLÓGICAS</h3>
                    <span id="estudianteSeleccionado">Seleccione un estudiante</span>
                </div>

                <!-- INDICADORES PNFT ESPECÍFICOS PARA TECNOLOGÍA -->
                <div class="indicators-container" id="indicadoresContainer">
                    <!-- Los indicadores se generarán dinámicamente -->
                </div>

                <!-- OBSERVACIONES ESPECÍFICAS -->
                <div style="margin-top: 30px;">
                    <h4 style="color: var(--dark); margin-bottom: 15px;">
                        <i class="fas fa-comment-medical"></i> OBSERVACIONES TÉCNICAS
                    </h4>
                    <div class="observations">
                        <textarea id="observacionesTecnicas" 
                                  placeholder="Describa el desempeño técnico del estudiante, manejo de herramientas, resolución de problemas, creatividad en soluciones tecnológicas..."></textarea>
                    </div>
                </div>

                <!-- RECOMENDACIONES TÉCNICAS -->
                <div style="margin-top: 20px;">
                    <h4 style="color: var(--dark); margin-bottom: 15px;">
                        <i class="fas fa-lightbulb"></i> RECOMENDACIONES PARA MEJORA TÉCNICA
                    </h4>
                    <div class="observations">
                        <textarea id="recomendacionesTecnicas" 
                                  placeholder="Sugerencias para mejorar competencias técnicas, recursos recomendados, prácticas adicionales..."></textarea>
                    </div>
                </div>

                <!-- RESUMEN DE EVALUACIÓN -->
                <div class="summary-grid" id="resumenEvaluacion">
                    <!-- El resumen se actualizará automáticamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT COMPLETO Y FUNCIONAL -->
    <script>
        // BASE DE DATOS INICIAL - ESTUDIANTES DE TECNOLOGÍA
        const estudiantesTecnologia = {
            tecno7: [
                { id: 1, nombre: "Ana", apellido: "García", avatar: "AG" },
                { id: 2, nombre: "Carlos", apellido: "Rodríguez", avatar: "CR" },
                { id: 3, nombre: "María", apellido: "López", avatar: "ML" },
                { id: 4, nombre: "José", apellido: "Fernández", avatar: "JF" },
                { id: 5, nombre: "Laura", apellido: "Martínez", avatar: "LM" }
            ],
            tecno8: [
                { id: 6, nombre: "Diego", apellido: "Sánchez", avatar: "DS" },
                { id: 7, nombre: "Sofía", apellido: "Pérez", avatar: "SP" },
                { id: 8, nombre: "Andrés", apellido: "Gómez", avatar: "AG" },
                { id: 9, nombre: "Valeria", apellido: "Hernández", avatar: "VH" }
            ],
            tecno9: [
                { id: 10, nombre: "Javier", apellido: "Ramírez", avatar: "JR" },
                { id: 11, nombre: "Camila", apellido: "Torres", avatar: "CT" },
                { id: 12, nombre: "Ricardo", apellido: "Díaz", avatar: "RD" }
            ]
        };

        // INDICADORES PNFT PARA FORMACIÓN TECNOLÓGICA (REALES)
        const indicadoresTecnologia = [
            {
                id: "tecno1",
                nombre: "MANEJO DE HERRAMIENTAS TECNOLÓGICAS",
                descripcion: "Utiliza correctamente software y hardware específico",
                niveles: [
                    { valor: 10, label: "DOMINIO", desc: "Domina todas las herramientas" },
                    { valor: 8, label: "COMPETENTE", desc: "Usa herramientas eficientemente" },
                    { valor: 6, label: "BÁSICO", desc: "Maneja herramientas con ayuda" },
                    { valor: 4, label: "EN PROCESO", desc: "Requiere supervisión constante" },
                    { valor: 2, label: "INICIAL", desc: "No maneja herramientas" }
                ]
            },
            {
                id: "tecno2",
                nombre: "RESOLUCIÓN DE PROBLEMAS TÉCNICOS",
                descripcion: "Identifica y soluciona incidencias tecnológicas",
                niveles: [
                    { valor: 10, label: "EXCELENTE", desc: "Resuelve problemas complejos" },
                    { valor: 8, label: "BUENO", desc: "Soluciona problemas comunes" },
                    { valor: 6, label: "SATISFACTORIO", desc: "Resuelve con orientación" },
                    { valor: 4, label: "EN DESARROLLO", desc: "Necesita ayuda constante" },
                    { valor: 2, label: "INSUFICIENTE", desc: "No resuelve problemas" }
                ]
            },
            {
                id: "tecno3",
                nombre: "CREATIVIDAD EN SOLUCIONES TECNOLÓGICAS",
                descripcion: "Propone ideas innovadoras en proyectos tecnológicos",
                niveles: [
                    { valor: 10, label: "INNOVADOR", desc: "Crea soluciones originales" },
                    { valor: 8, label: "CREATIVO", desc: "Propone mejoras interesantes" },
                    { valor: 6, label: "APLICADOR", desc: "Aplica soluciones existentes" },
                    { valor: 4, label: "REPRODUCTOR", desc: "Copia soluciones" },
                    { valor: 2, label: "LIMITADO", desc: "No muestra creatividad" }
                ]
            },
            {
                id: "tecno4",
                nombre: "TRABAJO COLABORATIVO EN PROYECTOS",
                descripcion: "Participa activamente en equipos de trabajo tecnológico",
                niveles: [
                    { valor: 10, label: "LÍDER", desc: "Coordina y motiva al equipo" },
                    { valor: 8, label: "COLABORADOR", desc: "Participa activamente" },
                    { valor: 6, label: "PARTICIPANTE", desc: "Cumple con asignaciones" },
                    { valor: 4, label: "PASIVO", desc: "Participa mínimamente" },
                    { valor: 2, label: "AUSENTE", desc: "No colabora" }
                ]
            },
            {
                id: "tecno5",
                nombre: "APLICACIÓN DE METODOLOGÍAS TÉCNICAS",
                descripcion: "Sigue procesos y metodologías establecidas",
                niveles: [
                    { valor: 10, label: "METÓDICO", desc: "Sigue metodologías rigurosamente" },
                    { valor: 8, label: "ORGANIZADO", desc: "Aplica procesos correctamente" },
                    { valor: 6, label: "ESTRUCTURADO", desc: "Sigue procesos básicos" },
                    { valor: 4, label: "DESORGANIZADO", desc: "No sigue metodologías" },
                    { valor: 2, label: "CAÓTICO", desc: "Trabaja sin método" }
                ]
            },
            {
                id: "tecno6",
                nombre: "PRESENTACIÓN DE RESULTADOS TÉCNICOS",
                descripcion: "Comunica efectivamente resultados de proyectos",
                niveles: [
                    { valor: 10, label: "EXCELENTE", desc: "Expone con claridad y precisión" },
                    { valor: 8, label: "CLARO", desc: "Comunica resultados efectivamente" },
                    { valor: 6, label: "COMPRENSIBLE", desc: "Se hace entender" },
                    { valor: 4, label: "CONFUSO", desc: "Comunica con dificultad" },
                    { valor: 2, label: "INEFICAZ", desc: "No comunica resultados" }
                ]
            }
        ];

        // VARIABLES GLOBALES
        let estudianteActual = null;
        let evaluaciones = JSON.parse(localStorage.getItem('tecnoPIA_evaluaciones')) || {};

        // INICIALIZAR SISTEMA
        document.addEventListener('DOMContentLoaded', function() {
            generarIndicadores();
            actualizarResumen();
            
            // Configurar fecha actual
            const fechaInputs = document.querySelectorAll('input[type="date"]');
            const hoy = new Date().toISOString().split('T')[0];
            fechaInputs.forEach(input => {
                if (!input.value) input.value = hoy;
            });
            
            mostrarNotificacion('Sistema de evaluación tecnológica cargado', 'success');
        });

        // CARGAR ESTUDIANTES DEL GRUPO SELECCIONADO
        function cargarEstudiantes() {
            const grupoId = document.getElementById('selectGrupo').value;
            const lista = document.getElementById('listaEstudiantes');
            
            if (!grupoId) {
                lista.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">Seleccione un grupo tecnológico</p>';
                return;
            }
            
            const estudiantes = estudiantesTecnologia[grupoId] || [];
            let html = '';
            
            estudiantes.forEach(est => {
                const evaluado = evaluaciones[`${grupoId}_${est.id}`] ? '✓' : '';
                html += `
                    <div class="student-item" onclick="seleccionarEstudiante('${grupoId}', ${est.id})" 
                         id="est_${grupoId}_${est.id}">
                        <div class="student-avatar">${est.avatar}</div>
                        <div class="student-info">
                            <h4>${est.nombre} ${est.apellido} ${evaluado}</h4>
                            <p>Estudiante de Tecnología</p>
                        </div>
                    </div>
                `;
            });
            
            lista.innerHTML = html;
            document.getElementById('contadorEstudiantes').textContent = `${estudiantes.length} estudiantes`;
        }

        // GENERAR INDICADORES TECNOLÓGICOS
        function generarIndicadores() {
            const container = document.getElementById('indicadoresContainer');
            let html = '';
            
            indicadoresTecnologia.forEach(ind => {
                html += `
                    <div class="indicator-card">
                        <div class="indicator-header">
                            <h4>${ind.nombre}</h4>
                            <div class="indicator-score" id="score_${ind.id}">0</div>
                        </div>
                        <p style="color: #666; font-size: 14px; margin-bottom: 15px;">${ind.descripcion}</p>
                        
                        <div class="rating-scale">
                            ${ind.niveles.map(nivel => `
                                <div class="rating-option" 
                                     onclick="seleccionarPuntuacion('${ind.id}', ${nivel.valor})"
                                     id="opt_${ind.id}_${nivel.valor}">
                                    <div class="rating-value">${nivel.valor}</div>
                                    <div class="rating-label">${nivel.label}</div>
                                    <small style="font-size: 11px; color: #999;">${nivel.desc}</small>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // SELECCIONAR ESTUDIANTE
        function seleccionarEstudiante(grupoId, estudianteId) {
            // Remover selección anterior
            document.querySelectorAll('.student-item.active').forEach(item => {
                item.classList.remove('active');
            });
            
            // Activar estudiante seleccionado
            const estudianteElement = document.getElementById(`est_${grupoId}_${estudianteId}`);
            if (estudianteElement) {
                estudianteElement.classList.add('active');
            }
            
            // Buscar datos del estudiante
            const estudiantes = estudiantesTecnologia[grupoId] || [];
            estudianteActual = estudiantes.find(e => e.id === estudianteId);
            
            if (estudianteActual) {
                document.getElementById('estudianteSeleccionado').innerHTML = 
                    `<strong>${estudianteActual.nombre} ${estudianteActual.apellido}</strong> - Evaluando`;
                
                // Cargar evaluación existente si la hay
                const key = `${grupoId}_${estudianteId}`;
                if (evaluaciones[key]) {
                    cargarEvaluacionExistente(evaluaciones[key]);
                } else {
                    limpiarEvaluacion();
                }
            }
        }

        // SELECCIONAR PUNTUACIÓN
        function seleccionarPuntuacion(indicatorId, valor) {
            // Remover selección anterior en este indicador
            document.querySelectorAll(`[id^="opt_${indicatorId}_"]`).forEach(opt => {
                opt.classList.remove('active');
            });
            
            // Activar opción seleccionada
            const opcion = document.getElementById(`opt_${indicatorId}_${valor}`);
            if (opcion) {
                opcion.classList.add('active');
            }
            
            // Actualizar puntuación mostrada
            document.getElementById(`score_${indicatorId}`).textContent = valor;
            
            // Actualizar resumen
            actualizarResumen();
        }

        // ACTUALIZAR RESUMEN
        function actualizarResumen() {
            const puntuaciones = [];
            
            // Obtener todas las puntuaciones seleccionadas
            indicadoresTecnologia.forEach(ind => {
                const opcionActiva = document.querySelector(`#opt_${ind.id}_`.active);
                if (opcionActiva) {
                    const valor = parseInt(opcionActiva.querySelector('.rating-value').textContent);
                    puntuaciones.push(valor);
                }
            });
            
            const resumen = document.getElementById('resumenEvaluacion');
            
            if (puntuaciones.length === 0) {
                resumen.innerHTML = `
                    <div class="summary-card">
                        <div class="summary-label">PROMEDIO</div>
                        <div class="summary-value">--</div>
                        <small>Seleccione puntuaciones</small>
                    </div>
                    <div class="summary-card">
                        <div class="summary-label">CALIFICACIÓN</div>
                        <div class="summary-value">--</div>
                        <small>No evaluado</small>
                    </div>
                `;
                return;
            }
            
            // Calcular estadísticas
            const suma = puntuaciones.reduce((a, b) => a + b, 0);
            const promedio = (suma / puntuaciones.length).toFixed(1);
            const porcentaje = ((suma / (puntuaciones.length * 10)) * 100).toFixed(1);
            
            // Determinar calificación
            let calificacion = "No evaluado";
            let color = "#666";
            
            if (porcentaje >= 90) {
                calificacion = "Excelente (A)";
                color = "#2ed573";
            } else if (porcentaje >= 80) {
                calificacion = "Muy Bueno (B)";
                color = "#7bed9f";
            } else if (porcentaje >= 70) {
                calificacion = "Bueno (C)";
                color = "#1e90ff";
            } else if (porcentaje >= 60) {
                calificacion = "Satisfactorio (D)";
                color = "#ffa502";
            } else {
                calificacion = "Insuficiente (F)";
                color = "#ff4757";
            }
            
            resumen.innerHTML = `
                <div class="summary-card">
                    <div class="summary-label">PROMEDIO</div>
                    <div class="summary-value">${promedio}/10</div>
                    <small>${puntuaciones.length} indicadores</small>
                </div>
                <div class="summary-card">
                    <div class="summary-label">PORCENTAJE</div>
                    <div class="summary-value">${porcentaje}%</div>
                    <small>Rendimiento técnico</small>
                </div>
                <div class="summary-card">
                    <div class="summary-label">CALIFICACIÓN MEP</div>
                    <div class="summary-value" style="color: ${color}">${calificacion.split(' ')[0]}</div>
                    <small>${calificacion}</small>
                </div>
                <div class="summary-card">
                    <div class="summary-label">ESTADO</div>
                    <div class="summary-value">${puntuaciones.length}/${indicadoresTecnologia.length}</div>
                    <small>Indicadores evaluados</small>
                </div>
            `;
        }

        // GUARDAR EVALUACIÓN
        function guardarEvaluacion() {
            if (!estudianteActual) {
                mostrarNotificacion('Seleccione un estudiante primero', 'error');
                return;
            }
            
            const grupoId = document.getElementById('selectGrupo').value;
            if (!grupoId) {
                mostrarNotificacion('Seleccione un grupo', 'error');
                return;
            }
            
            // Recopilar datos de la evaluación
            const evaluacion = {
                id: Date.now(),
                fecha: new Date().toISOString(),
                fechaLegible: new Date().toLocaleDateString('es-CR'),
                grupoId: grupoId,
                estudianteId: estudianteActual.id,
                estudianteNombre: `${estudianteActual.nombre} ${estudianteActual.apellido}`,
                periodo: document.getElementById('selectPeriodo').value,
                modulo: document.getElementById('selectModulo').value,
                evidencia: document.getElementById('selectEvidencia').value,
                observaciones: document.getElementById('observacionesTecnicas').value,
                recomendaciones: document.getElementById('recomendacionesTecnicas').value,
                calificacion: obtenerCalificacionFinal()
            };
            
            // Recopilar puntuaciones
            evaluacion.puntuaciones = {};
            indicadoresTecnologia.forEach(ind => {
                const opcionActiva = document.querySelector(`#opt_${ind.id}_`.active);
                if (opcionActiva) {
                    const valor = parseInt(opcionActiva.querySelector('.rating-value').textContent);
                    evaluacion.puntuaciones[ind.id] = valor;
                }
            });
            
            // Guardar en localStorage
            const key = `${grupoId}_${estudianteActual.id}`;
            evaluaciones[key] = evaluacion;
            localStorage.setItem('tecnoPIA_evaluaciones', JSON.stringify(evaluaciones));
            
            // Actualizar interfaz
            const estudianteElement = document.getElementById(`est_${grupoId}_${estudianteActual.id}`);
            if (estudianteElement) {
                const nombreElement = estudianteElement.querySelector('h4');
                if (!nombreElement.textContent.includes('✓')) {
                    nombreElement.textContent += ' ✓';
                }
            }
            
            mostrarNotificacion(`Evaluación de ${estudianteActual.nombre} guardada exitosamente`, 'success');
        }

        // OBTENER CALIFICACIÓN FINAL
        function obtenerCalificacionFinal() {
            const puntuaciones = [];
            
            indicadoresTecnologia.forEach(ind => {
                const opcionActiva = document.querySelector(`#opt_${ind.id}_`.active);
                if (opcionActiva) {
                    const valor = parseInt(opcionActiva.querySelector('.rating-value').textContent);
                    puntuaciones.push(valor);
                }
            });
            
            if (puntuaciones.length === 0) return "No evaluado";
            
            const promedio = puntuaciones.reduce((a, b) => a + b, 0) / puntuaciones.length;
            
            if (promedio >= 9) return "Excelente (A)";
            if (promedio >= 8) return "Muy Bueno (B)";
            if (promedio >= 7) return "Bueno (C)";
            if (promedio >= 6) return "Satisfactorio (D)";
            return "Insuficiente (F)";
        }

        // CARGAR EVALUACIÓN EXISTENTE
        function cargarEvaluacionExistente(evaluacion) {
            // Cargar puntuaciones
            if (evaluacion.puntuaciones) {
                Object.keys(evaluacion.puntuaciones).forEach(indId => {
                    const valor = evaluacion.puntuaciones[indId];
                    seleccionarPuntuacion(indId, valor);
                });
            }
            
            // Cargar observaciones
            if (evaluacion.observaciones) {
                document.getElementById('observacionesTecnicas').value = evaluacion.observaciones;
            }
            
            // Cargar recomendaciones
            if (evaluacion.recomendaciones) {
                document.getElementById('recomendacionesTecnicas').value = evaluacion.recomendaciones;
            }
            
            mostrarNotificacion('Evaluación anterior cargada', 'success');
        }

        // LIMPIAR EVALUACIÓN
        function limpiarEvaluacion() {
            document.querySelectorAll('.rating-option.active').forEach(opt => {
                opt.classList.remove('active');
            });
            
            indicadoresTecnologia.forEach(ind => {
                document.getElementById(`score_${ind.id}`).textContent = '0';
            });
            
            document.getElementById('observacionesTecnicas').value = '';
            document.getElementById('recomendacionesTecnicas').value = '';
            
            actualizarResumen();
        }

        // EXPORTAR EVALUACIÓN (FORMATO MEP)
        function exportarEvaluacion() {
            if (!estudianteActual) {
                mostrarNotificacion('Seleccione un estudiante para exportar', 'error');
                return;
            }
            
            const grupoId = document.getElementById('selectGrupo').value;
            const key = `${grupoId}_${estudianteActual.id}`;
            const evaluacion = evaluaciones[key];
            
            if (!evaluacion) {
                mostrarNotificacion('Primero guarde la evaluación', 'error');
                return;
            }
            
            // Generar contenido del informe
            let contenido = `INFORME DE EVALUACIÓN TECNOLÓGICA - MEP\n`;
            contenido += `===========================================\n\n`;
            contenido += `ESTUDIANTE: ${evaluacion.estudianteNombre}\n`;
            contenido += `GRUPO: ${document.getElementById('selectGrupo').selectedOptions[0].text}\n`;
            contenido += `MÓDULO: ${document.getElementById('selectModulo').selectedOptions[0].text}\n`;
            contenido += `PERÍODO: ${document.getElementById('selectPeriodo').selectedOptions[0].text}\n`;
            contenido += `FECHA: ${evaluacion.fechaLegible}\n`;
            contenido += `CALIFICACIÓN: ${evaluacion.calificacion}\n\n`;
            
            contenido += `RESULTADOS POR COMPETENCIA:\n`;
            contenido += `--------------------------\n`;
            
            indicadoresTecnologia.forEach(ind => {
                const puntuacion = evaluacion.puntuaciones[ind.id] || 'No evaluado';
                contenido += `${ind.nombre}: ${puntuacion}/10\n`;
            });
            
            contenido += `\nOBSERVACIONES:\n`;
            contenido += `--------------\n`;
            contenido += `${evaluacion.observaciones || 'Sin observaciones'}\n\n`;
            
            contenido += `RECOMENDACIONES:\n`;
            contenido += `----------------\n`;
            contenido += `${evaluacion.recomendaciones || 'Sin recomendaciones'}\n\n`;
            
            contenido += `----------------------------------------\n`;
            contenido += `Documento generado por TecnoPIA - Sistema de Evaluación MEP\n`;
            contenido += `Fecha de generación: ${new Date().toLocaleString('es-CR')}\n`;
            
            // Crear y descargar archivo
            const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Evaluacion_${evaluacion.estudianteNombre}_${evaluacion.fechaLegible}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            mostrarNotificacion('Evaluación exportada exitosamente', 'success');
        }

        // MOSTRAR NOTIFICACIÓN
        function mostrarNotificacion(mensaje, tipo = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${tipo}`;
            notification.innerHTML = `
                <i class="fas fa-${tipo === 'success' ? 'check-circle' : 'exclamation-circle'}"></i>
                ${mensaje}
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        }

        // AGREGAR ICONOS FONT AWESOME
        const faLink = document.createElement('link');
        faLink.rel = 'stylesheet';
        faLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
        document.head.appendChild(faLink);
    </script>
</body>
